<!DOCTYPE html>
<html>
  <head>
    </head>

  <body>
    <button onclick="multiply(4)">Click Me!</button>
    <p id="result"></p>
  </body>
  <script>
function multiply(a,b)
{
  if(b === undefined) {
    alert("The value of b is undefined, so it will be set to 5.");
    b = 5;
    a = 4;
  }
  var result = a * b;
  document.getElementById("result").innerHTML = result;
}
</script>

</html>
